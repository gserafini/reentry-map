# B083: include only inside the four Reentry Map production/staging vhosts.
# Do not install globally or in both the reentrymap.com and .org include dirs:
# those domain include directories belong to the same production vhost.
# Keep CRS 911100 active. Append only the method of this matching transaction;
# application authorization, all other CRS rules, and Imunify remain unchanged.
# Canonical paths only; UUID route parameters match the application schema.

SecRule REQUEST_METHOD "@streq PATCH" \
    "id:999090,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@rx \A/api/(?:profile|reviews|admin/users|admin/expansion-priorities/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}|admin/resources/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/update)(?:\?.*)?\z" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PATCH'"

SecRule REQUEST_METHOD "@streq DELETE" \
    "id:999091,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@rx \A/api/(?:reviews(?:/helpfulness)?|favorites|ratings|admin/users|admin/(?:expansion-priorities|resources)/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12})(?:\?.*)?\z" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} DELETE'"

SecRule REQUEST_METHOD "@streq PUT" \
    "id:999092,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@rx \A/api/(?:(?:suggestions|updates)/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/status|admin/resources/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12})(?:\?.*)?\z" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT'"
